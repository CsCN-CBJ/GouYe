<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TODO - 狗爷收支</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="todo.css">
</head>

<body>
    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- 主内容 -->
    <div class="content-area">
        <div class="px-6 pt-10">
            <!-- 标题栏 -->
            <div class="flex justify-between items-center mb-6">
                <h1 class="font-bold text-xl">TODO</h1>
                <div class="flex items-center gap-3">
                    <button class="px-3 py-1.5 bg-black text-white text-xs font-semibold rounded-lg active:scale-[0.96] transition-transform" onclick="openTodoModal()">
                        <i class="fas fa-plus mr-1"></i>新建
                    </button>
                    <button class="px-3 py-1.5 bg-gray-100 text-gray-600 text-xs font-semibold rounded-lg active:scale-[0.96] transition-transform" onclick="openReportListModal()">
                        <i class="fas fa-chart-line mr-1"></i>周报
                    </button>
                    <button class="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400" onclick="location.href='/'">
                        <i class="fas fa-user"></i>
                    </button>
                    <button id="toggleFilterBtn" class="text-gray-400 text-sm">
                        <i class="fas fa-filter mr-1"></i>筛选
                    </button>
                </div>
            </div>

            <!-- 筛选栏 -->
            <div id="filterBar" class="filter-bar hidden mb-4">
                <div class="grid grid-cols-2 gap-3">
                    <select id="filterDomain" class="filter-select">
                        <option value="">全部领域</option>
                        <option value="work">工作</option>
                        <option value="life">生活</option>
                    </select>
                    <select id="filterStatus" class="filter-select">
                        <option value="">全部状态</option>
                        <option value="not_started">未开始</option>
                        <option value="in_progress">进行中</option>
                        <option value="blocked">阻塞</option>
                        <option value="completed">已完成</option>
                        <option value="cancelled">已取消</option>
                    </select>
                    <select id="filterProject" class="filter-select">
                        <option value="">全部项目</option>
                    </select>
                    <select id="filterTag" class="filter-select">
                        <option value="">全部标签</option>
                    </select>
                </div>
            </div>

            <!-- 统计概览 -->
            <div class="flex justify-between items-center bg-gray-50 rounded-2xl p-4 mb-6">
                <div class="text-center flex-1 border-r border-gray-200">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">未开始</p>
                    <p class="text-lg font-bold text-gray-500" id="statPending">0</p>
                </div>
                <div class="text-center flex-1 border-r border-gray-200">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">进行中</p>
                    <p class="text-lg font-bold text-blue-500" id="statInProgress">0</p>
                </div>
                <div class="text-center flex-1 border-r border-gray-200">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">阻塞</p>
                    <p class="text-lg font-bold text-red-500" id="statBlocked">0</p>
                </div>
                <div class="text-center flex-1 border-r border-gray-200">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">已完成</p>
                    <p class="text-lg font-bold text-emerald-500" id="statDone">0</p>
                </div>
                <div class="text-center flex-1">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">已取消</p>
                    <p class="text-lg font-bold text-gray-300" id="statCancelled">0</p>
                </div>
            </div>

            <!-- TODO 列表 -->
            <div id="todoList" class="space-y-3 pb-4">
                <div id="skeleton" class="space-y-4">
                    <div class="skeleton w-full h-16 rounded-xl"></div>
                    <div class="skeleton w-full h-16 rounded-xl"></div>
                    <div class="skeleton w-full h-16 rounded-xl"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="tab-bar">
        <div class="tab-item" onclick="location.href='/'">
            <i class="fas fa-home"></i>
        </div>
        <div class="ai-btn" onclick="openAIModal()">
            <i class="fas fa-plus"></i>
        </div>
        <div class="tab-item active">
            <i class="fas fa-check-square"></i>
        </div>
        <div class="tab-item" onclick="location.href='/pages/checkin.html'">
            <i class="fas fa-calendar-check"></i>
        </div>
    </div>

    <!-- TODO 创建/编辑弹窗 -->
    <div id="todoModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay" id="todoModalOverlay"></div>
        <div class="modal-content" id="todoModalContent">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-lg" id="todoModalTitle">新建 TODO</h3>
                    <button class="text-gray-400 text-xl" onclick="closeTodoModal()"><i class="fas fa-times"></i></button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">标题</label>
                        <input type="text" id="todoTitle" placeholder="要做什么？"
                            class="w-full px-4 py-3 bg-gray-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black/10 transition">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">领域</label>
                            <select id="todoDomain" class="w-full px-4 py-3 bg-gray-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black/10 transition">
                                <option value="work">工作</option>
                                <option value="life">生活</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">状态</label>
                            <select id="todoStatus" class="w-full px-4 py-3 bg-gray-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black/10 transition">
                                <option value="not_started">未开始</option>
                                <option value="in_progress">进行中</option>
                                <option value="blocked">阻塞</option>
                                <option value="completed">已完成</option>
                                <option value="cancelled">已取消</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">项目</label>
                        <select id="todoProject" class="w-full px-4 py-3 bg-gray-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black/10 transition">
                            <option value="">无项目</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">标签（多选）</label>
                        <div id="todoTagSelector" class="flex flex-wrap gap-2"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">截止日期</label>
                            <input type="datetime-local" id="todoDueAt"
                                class="w-full px-4 py-3 bg-gray-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black/10 transition">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">优先级</label>
                            <select id="todoPriority" class="w-full px-4 py-3 bg-gray-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-black/10 transition">
                                <option value="low">低</option>
                                <option value="medium">中</option>
                                <option value="high">高</option>
                            </select>
                        </div>
                    </div>
                    <button id="saveTodoBtn"
                        class="w-full py-3 bg-black text-white rounded-xl font-bold text-sm active:scale-[0.98] transition-transform disabled:opacity-50">
                        保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- AI 输入弹窗 -->
    <div id="aiModal" class="fixed inset-0 z-[110] hidden">
        <div class="modal-overlay" onclick="closeAIModal()"></div>
        <div class="modal-content" id="aiModalContent">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">AI 录入</h3>
                    <button class="text-gray-400 text-xl" onclick="closeAIModal()"><i class="fas fa-times"></i></button>
                </div>
                <ai-input id="aiInput"></ai-input>
            </div>
        </div>
    </div>

    <!-- Proposal 卡片 -->
    <proposal-card id="proposalCard"></proposal-card>

    <!-- 周报列表弹窗 -->
    <div id="reportListModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay" onclick="closeReportListModal()"></div>
        <div class="modal-content" id="reportListModalContent">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">周报</h3>
                    <div class="flex items-center gap-3">
                        <button id="generateBtn" class="px-3 py-1.5 bg-black text-white text-xs font-semibold rounded-lg active:scale-[0.96] transition-transform disabled:opacity-50">
                            <i class="fas fa-wand-magic-sparkles mr-1"></i>生成
                        </button>
                        <button class="text-gray-400 text-xl" onclick="closeReportListModal()"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <div id="generatingState" class="hidden mb-4">
                    <div class="bg-gray-50 rounded-2xl p-4 text-center">
                        <i class="fas fa-spinner fa-spin text-xl text-gray-400 mb-2"></i>
                        <p class="text-xs text-gray-500">AI 正在生成周报...</p>
                    </div>
                </div>
                <div id="reportList" class="space-y-3 max-h-[50vh] overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- 周报详情弹窗 -->
    <div id="reportModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay" onclick="closeReportModal()"></div>
        <div class="modal-content flex flex-col" id="reportModalContent">
            <div class="p-6 flex-1 overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg" id="reportModalTitle">周报详情</h3>
                    <button class="text-gray-400 text-xl" onclick="closeReportModal()"><i class="fas fa-times"></i></button>
                </div>
                <div id="reportContent" class="markdown-body"></div>
            </div>
            <div class="p-4 border-t border-gray-100 text-center">
                <span class="text-xs text-gray-400" id="reportMeta"></span>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="../js/utils.js"></script>
    <script src="../components/ai-input.js"></script>
    <script src="../components/proposal-card.js"></script>
    <script src="todo.js"></script>
</body>

</html>
